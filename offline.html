<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluentr — Offline</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#faf9fc; font-family: -apple-system, 'Segoe UI', sans-serif; color:#1a1523; text-align:center; padding:24px; }
  .box { max-width: 340px; }
  .mark { width:64px;height:64px;border-radius:18px;background:#5b3df5;margin:0 auto 18px; }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p { font-size: 14px; color:#645c72; line-height:1.5; margin: 0 0 20px;}
  button { border:none; background:#5b3df5; color:#fff; font-weight:700; padding:12px 22px; border-radius:999px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark"></div>
    <h1>You're offline</h1>
    <p>This page hasn't been cached yet. Most of Fluentr — lessons, traps, SOS, your progress — works fully offline once you've opened it at least once.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
